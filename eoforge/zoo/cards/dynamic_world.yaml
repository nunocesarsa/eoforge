id: dynamic-world
name: Dynamic World land cover
adapter: onnx
task: segmentation
description: >
  Google's near-real-time global 10 m land use / land cover model (9 classes), the model behind the
  Dynamic World dataset. Fully convolutional; runs on single Sentinel-2 scenes or composites.
sensor: Sentinel-2 L1C (top-of-atmosphere reflectance x 10000)
bands: [B02, B03, B04, B05, B06, B07, B08, B11, B12]
resolution_m: 10
classes:
  - {value: 0, name: water, colour: "#419bdf"}
  - {value: 1, name: trees, colour: "#397d49"}
  - {value: 2, name: grass, colour: "#88b053"}
  - {value: 3, name: flooded vegetation, colour: "#7a87c6"}
  - {value: 4, name: crops, colour: "#e49635"}
  - {value: 5, name: shrub and scrub, colour: "#dfc35a"}
  - {value: 6, name: built, colour: "#c4281b"}
  - {value: 7, name: bare, colour: "#a59b8f"}
  - {value: 8, name: snow and ice, colour: "#b39fe1"}
params:
  layout: NHWC
  normalise: {type: dynamic_world}
  output: logits
  tile: 1024
  overlap: 64
  batch: 1
weights: {path: weights/dynamic_world_forward.onnx}
licence: Apache-2.0 (Google LLC); converted to ONNX, see weights/DYNAMIC_WORLD_NOTICE.txt
source: https://github.com/google/dynamicworld
citation: Brown et al. (2022) Dynamic World, Near real-time global 10 m land use land cover mapping. Sci Data 9, 251.
notes: >
  Trained on L1C. Surface reflectance (L2A) images also run but values differ, so expect some shifts.
  The published product also masks clouds and applies spatial smoothing; this is the raw model.
install: "bash install.sh   (installs every model; see README)"
