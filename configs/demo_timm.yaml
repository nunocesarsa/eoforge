# Land-cover segmentation on a local GeoTIFF with vector labels.
# Run:  eoforge demo --out demo      then   eoforge train configs/demo_unet.yaml
# Relative paths are resolved from this file's folder.

name: demo_timm
output_dir: ../runs

data:
  source: local                 # local | stac | gee  (stac and gee are the next pipelines)
  path: ../demo/scene_2023.tif
  bands: null                   # e.g. [2, 3, 4, 8] to pick 1-based bands; null = all

labels:
  path: ../demo/labels_2023.gpkg
  class_field: class
  classes: [water, grassland, shrubland, woodland, bare, cropland]   # fixes class ids
  point_buffer: 10              # metres: points become ~3x3 px patches

model:
  arch: timm:resnet18
  params: {pretrained: false}
  weights: null                 # start from a checkpoint to fine-tune
  freeze_encoder: false

train:
  chip_size: 64
  chips_per_epoch: 384
  batch_size: 16
  epochs: 6
  lr: 0.002
  val_fraction: 0.25
  block_size: 128               # spatial blocks for the train/val split
  class_weights: balanced
  device: auto

predict:
  tile_size: 256
  overlap: 32
  write_entropy: true
  write_probabilities: false
